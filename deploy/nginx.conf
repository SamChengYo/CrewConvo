# Reverse proxy with TLS in front of CrewConvo. Set PUBLIC_BASE_URL=https://crewconvo.example.com in .env.
# WebSockets (/ws, /agent/v1/ws), MCP streaming (/mcp) and long-poll (/agent/v1/events) need the settings below.
server {
    listen 443 ssl http2;
    server_name crewconvo.example.com;
    ssl_certificate     /etc/letsencrypt/live/crewconvo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crewconvo.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;            # MCP SSE / long-poll
        proxy_read_timeout 3600s;
    }
}

# in the http {} block:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
