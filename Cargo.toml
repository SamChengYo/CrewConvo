[workspace]
resolver = "3"
members = [
    "crates/ac-core",
    "crates/ac-store",
    "crates/ac-wake",
    "crates/ac-context",
    "crates/ac-service",
    "crates/ac-llm",
    "crates/ac-runtime",
    "crates/ac-server",
    "crates/ac-search",
    "crates/ac-decider",
    "crates/ac-sandbox",
    "crates/ac-cli",
    "crates/ac-example-agent",
    "crates/ac-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-store = { path = "crates/ac-store" }
ac-wake = { path = "crates/ac-wake" }
ac-context = { path = "crates/ac-context" }
ac-service = { path = "crates/ac-service" }
ac-llm = { path = "crates/ac-llm" }
ac-runtime = { path = "crates/ac-runtime" }
ac-search = { path = "crates/ac-search" }
ac-decider = { path = "crates/ac-decider" }
ac-sandbox = { path = "crates/ac-sandbox" }

tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
tantivy = "0.27.0"
jieba-rs = "0.11.0"
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.3.4"
hmac = "0.13.0"
url = "2"
bollard = "0.21.1"
rmcp = { version = "3.10.0", features = ["server", "transport-streamable-http-server", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
