# Builds the server for Windows, macOS and Linux and attaches the archives to a GitHub Release.
# Runs when a tag like v0.3.0 is pushed.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --release --bin crewconvo-server
      - name: Build the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p ac-desktop
          cp target/release/CrewConvo.exe CrewConvo-windows-x86_64.exe
      - name: Package
        shell: bash
        run: |
          dir="crewconvo-${{ matrix.name }}"
          mkdir -p "$dir"
          cp -r web/dist "$dir/web"
          cp .env.example LICENSE NOTICE README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/crewconvo-server.exe "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
          else
            cp target/release/crewconvo-server "$dir/"
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            crewconvo-*.zip
            crewconvo-*.tar.gz
            CrewConvo-windows-x86_64.exe
